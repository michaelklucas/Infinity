<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Infinity Framework</title>
    <link rel="icon" type="image/svg+xml" href="/resources/view/assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --bg: #0b0f1a;
            --bg-accent: #131926;
            --card: rgba(30, 41, 59, 0.5);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.07);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 35%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 20%;
            padding: 0 20px;
        }

        header {
            background: rgba(11, 15, 26, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.2rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        main {
            flex: 1;
            padding: 4rem 0;
        }

        footer {
            background: var(--glass);
            border-top: 1px solid var(--glass-border);
            padding: 1rem 0;
            margin-top: 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* UI Components */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .card h3 {
            margin-bottom: 1rem;
            color: #818cf8;
        }

        .card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-gradient);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        /* Alerts & Flash */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: none;
        }

        .alert:not(:empty) {
            display: block;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        /* Hero Section */
        .hero {
            padding: 10rem 0 6rem;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.4rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Helpers */
        .text-center {
            text-align: center;
        }

        .mt-4 {
            margin-top: 2rem;
        }

        /* Brand Logo Style */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .brand-container:hover {
            transform: scale(1.05);
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.8));
        }

        .brand-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .infinity-mark {
            fill: none;
            stroke: url(#infinity-gradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawInfinity 3s ease forwards, glowPulse 2s infinite alternate;
        }

        @keyframes drawInfinity {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes glowPulse {
            from {
                filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5));
            }

            to {
                filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.8));
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <a href="/" class="brand-container">
                    <svg class="brand-logo" viewBox="0 0 100 50">
                        <defs>
                            <linearGradient id="infinity-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path class="infinity-mark"
                            d="M50,25 C35,10 15,10 15,25 C15,40 35,40 50,25 C65,10 85,10 85,25 C85,40 65,40 50,25" />
                    </svg>
                    <span class="brand-text">INFINITY</span>
                </a>

                <!-- Centered Links -->
                <div class="nav-links">
                    <a href="/">Início</a>
                    <a href="#">Preços</a>
                    <a href="#">Comunidade</a>
                    <a href="/docs">Docs</a>
                </div>

                <!-- Right Actions -->
                <div class="nav-actions" style="display: flex; align-items: center; gap: 1rem;">
                    <a href="/login" style="color: var(--text); text-decoration: none; font-weight: 500;">Entrar</a>
                    <a href="/register" class="btn"
                        style="padding: 0.6rem 1.5rem; font-size: 0.9rem; border-radius: 12px;">Cadastre-se</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Flash Messages -->
        <div class="alert alert-success">{{flash.success}}</div>
        <div class="alert alert-error">{{flash.error}}</div>

        {{content}}
    </main>

    <footer>
        <div class="container">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div class="brand-container" style="transform: scale(0.8); pointer-events: none; opacity: 0.7;">
                    <svg class="brand-logo" viewBox="0 0 100 50">
                        <path class="infinity-mark"
                            d="M50,25 C35,10 15,10 15,25 C15,40 35,40 50,25 C65,10 85,10 85,25 C85,40 65,40 50,25" />
                    </svg>
                    <span class="brand-text">INFINITY</span>
                </div>
                <p>&copy; Infinity Framework. Projetado para velocidade e elegância.</p>
            </div>
            <div class="social-links" style="margin-top: 15px; display: flex; justify-content: center; gap: 20px;">
                <a href="https://github.com/michaelklucas/Infinity" target="_blank"
                    style="color: var(--text-muted); font-size: 1.5rem; text-decoration: none; transition: color 0.3s;"><i
                        class='bx bxl-github'></i></a>
                <a href="https://www.instagram.com/michaelsimao.dev/" target="_blank"
                    style="color: var(--text-muted); font-size: 1.5rem; text-decoration: none; transition: color 0.3s;"><i
                        class='bx bxl-instagram'></i></a>
            </div>
        </div>
    </footer>

</body>

</html>
