<div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px;">
    <div class="stat-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div
                style="width: 40px; height: 40px; background: rgba(99, 102, 241, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <i class='bx bx-user' style="color: #6366f1; font-size: 1.2rem;"></i>
            </div>
            <span
                style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">+12%</span>
        </div>
        <h4>Usuários SaaS</h4>
        <div class="value">1,284</div>
    </div>
    <div class="stat-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div
                style="width: 40px; height: 40px; background: rgba(168, 85, 247, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <i class='bx bx-dollar-circle' style="color: #a855f7; font-size: 1.2rem;"></i>
            </div>
            <span
                style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">+5.4%</span>
        </div>
        <h4>Receita Mensal</h4>
        <div class="value">R$ 12.450</div>
    </div>
    <div class="stat-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div
                style="width: 40px; height: 40px; background: rgba(59, 130, 246, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <i class='bx bx-server' style="color: #3b82f6; font-size: 1.2rem;"></i>
            </div>
            <span
                style="background: rgba(99, 102, 241, 0.1); color: #6366f1; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">Stable</span>
        </div>
        <h4>Requisições API</h4>
        <div class="value">458k</div>
    </div>
    <div class="stat-card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div
                style="width: 40px; height: 40px; background: rgba(239, 68, 68, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                <i class='bx bx-pulse' style="color: #ef4444; font-size: 1.2rem;"></i>
            </div>
            <span
                style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;">Otimo</span>
        </div>
        <h4>Uso de CPU</h4>
        <div class="value">12%</div>
    </div>
</div>

<div class="card" style="margin-top: 30px; backdrop-filter: blur(15px); border: 1px solid var(--border);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <div>
            <h3 style="margin: 0; font-size: 1.2rem;">Visão Geral do Sistema</h3>
            <p style="margin-top: 5px; color: var(--text-muted); font-size: 0.9rem;">Monitoramento de performance em
                tempo real.</p>
        </div>
        <button class="btn" style="padding: 8px 16px; font-size: 0.85rem;">
            <i class='bx bx-refresh' style="margin-right: 5px;"></i> Atualizar
        </button>
    </div>

    <div
        style="height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px dashed var(--border); background: rgba(0,0,0,0.1);">
        <div style="text-align: center; color: var(--text-muted);">
            <i class='bx bx-bar-chart-alt-2' style="font-size: 3rem; margin-bottom: 10px; opacity: 0.5;"></i>
            <p>Os gráficos de performance seriam renderizados aqui.</p>
        </div>
    </div>
</div>
