<div class="card" style="max-width: 500px; margin: 120px auto; padding: 40px;">
    <h2 style="margin-top: 0; color: var(--text); font-weight: 700; font-size: 1.8rem; margin-bottom: 10px;">Criar Conta
    </h2>
    <p style="color: var(--text-muted); margin-bottom: 30px;">Junte-se à revolução do desenvolvimento PHP.</p>

    <form action="/register" method="POST">
        {{csrf}}

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem;">Nome
                Completo</label>
            <input type="text" name="nome" placeholder="Seu nome"
                style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; outline: none; transition: border-color 0.3s;">
            <small style="color: #f87171; margin-top: 5px; display: block;">{{error.nome}}</small>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem;">E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com"
                style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; outline: none; transition: border-color 0.3s;">
            <small style="color: #f87171; margin-top: 5px; display: block;">{{error.email}}</small>
        </div>

        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem;">Senha</label>
            <input type="password" name="senha" placeholder="Min. 8 caracteres"
                style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; outline: none; transition: border-color 0.3s;">
            <small style="color: #f87171; margin-top: 5px; display: block;">{{error.senha}}</small>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center;">
            <i class='bx bx-rocket' style="margin-right: 8px; font-size: 1.2rem;"></i> Finalizar Cadastro
        </button>
    </form>
</div>

<style>
    input:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
</style>
